<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><defs><radialGradient id="bg" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#1C1640"/><stop offset="0.6" stop-color="#110E26"/><stop offset="1" stop-color="#090713"/></radialGradient></defs><circle cx="512" cy="512" r="512" fill="url(#bg)"/>
  <defs>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00C2FF"/>
      <stop offset="0.45" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#B04BFF"/>
    </linearGradient>
    <linearGradient id="neonA" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#3FD8FF"/>
      <stop offset="1" stop-color="#C77BFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <g id="content">
    <!-- Halo neón (copias desenfocadas) -->
    <g filter="url(#glow)" opacity="0.85">
      <circle cx="512" cy="512" r="300" fill="none" stroke="url(#neon)" stroke-width="56"
              stroke-dasharray="1130 34 420 34 230 34" stroke-dashoffset="-40" transform="rotate(-90 512 512)"/>
      <path d="M392 690 L512 352 L632 690" fill="none" stroke="url(#neonA)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Anillo segmentado (como el círculo de gasto) -->
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#neon)" stroke-width="52"
            stroke-dasharray="1130 34 420 34 230 34" stroke-dashoffset="-40" stroke-linecap="butt" transform="rotate(-90 512 512)"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"
            stroke-dasharray="1130 34 420 34 230 34" stroke-dashoffset="-40" transform="rotate(-90 512 512)"/>
    <!-- "A" de Aurea con travesaño en forma de línea ascendente -->
    <g filter="url(#glowSoft)" opacity="0.9">
      <path d="M392 690 L512 352 L632 690" fill="none" stroke="url(#neonA)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M392 690 L512 352 L632 690" fill="none" stroke="url(#neonA)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 690 L512 352 L632 690" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="430,590 482,552 530,574 600,512" fill="none" stroke="#EAF6FF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="600" cy="512" r="18" fill="#EAF6FF"/>
  </g>
</svg>
